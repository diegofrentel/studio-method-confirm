<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>E-mail confirmado — Studio Method</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #2a2a3d 0%, #0f0f17 60%, #0a0a10 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.45);
  }
  .check {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px auto;
    font-size: 32px;
    box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
  }
  h1 {
    font-size: 18px;
    color: #fff;
    margin: 0 0 12px 0;
  }
  p {
    font-size: 13px;
    color: #a1a1aa;
    line-height: 1.6;
    margin: 0 0 4px 0;
  }
  .brand {
    margin-top: 28px;
    font-size: 11px;
    color: #52525b;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>E-mail confirmado!</h1>
    <p>Sua conta no Studio Method foi confirmada com sucesso.</p>
    <p>Você já pode voltar ao aplicativo e fazer login.</p>
    <p style="margin-top: 16px; color: #71717a;">Pode fechar esta aba.</p>
    <div class="brand">STUDIO METHOD</div>
  </div>
</body>
</html>
